<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tonton par (et pour) ecoBAT – Site en construction</title>
  <link rel="icon" type="image/svg+xml" href="favicon-tonton.svg">
  <style>
    :root {
      --vert: #8cc04d;
      --gris: #4f4c4c;
      --fond: #f7f8f4;
      --texte: #4f4c4c;
      --doux: #8a8787;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fond: #1f1e1e;
        --texte: #ecebea;
        --doux: #a9a6a6;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--fond);
      color: var(--texte);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    main { max-width: 560px; }
    .logo {
      width: 160px;
      height: auto;
      margin-bottom: 32px;
      animation: flotte 4s ease-in-out infinite;
    }
    @media (prefers-color-scheme: dark) {
      .logo { filter: brightness(1.6); }
    }
    h1 {
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .sous-titre {
      margin-top: 10px;
      font-size: clamp(1.05rem, 3.5vw, 1.3rem);
      color: var(--doux);
    }
    .sous-titre strong { color: var(--vert); font-weight: 700; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 36px;
      padding: 10px 20px;
      border: 2px solid var(--vert);
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .point {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--vert);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes flotte {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .35; transform: scale(.75); }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo, .point { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="icone-tonton.svg" alt="Logo Tonton">
    <h1>Tonton</h1>
    <p class="sous-titre">par (et pour) <strong>ecoBAT</strong></p>
    <p class="badge"><span class="point"></span>Site en construction</p>
  </main>
</body>
</html>
